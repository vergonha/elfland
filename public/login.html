<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NodeCast TV</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <style>
        html,
        body {
            overflow: auto;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: var(--space-xl);
        }

        .login-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-xl);
        }

        .login-art {
            -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
            mask-image: linear-gradient(to bottom, #000, transparent);
            max-width: 100%;
            overflow-x: auto;
        }

        .login-art pre {
            display: inline-block;
            min-width: max-content;
            white-space: pre;
            letter-spacing: 0;
            font-size: 15px;
            color: var(--color-text-primary);
            user-select: none;
        }

        .login-form {
            width: 100%;
            max-width: 384px;
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .form-row label {
            width: 64px;
            text-align: right;
            color: var(--color-accent);
        }

        .form-row input {
            flex: 1;
            min-width: 0;
            padding: 6px 12px;
            background: rgba(38, 38, 38, 0.5);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-accent-hover);
            font-family: var(--font-mono);
            font-size: 14px;
            transition: border-color 0.15s;
        }

        .form-row input:focus {
            outline: none;
            border-color: var(--color-border-light);
        }

        .form-row input::placeholder {
            color: var(--color-text-muted);
        }

        .login-actions {
            display: flex;
            justify-content: center;
            gap: var(--space-lg);
            margin-top: var(--space-sm);
        }

        .login-actions button {
            background: none;
            border: none;
            padding: 0;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--color-text-muted);
            cursor: pointer;
            transition: color 0.15s;
        }

        .login-actions button:hover:not(:disabled) {
            color: var(--color-accent-hover);
        }

        .login-actions button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message,
        .setup-message {
            display: none;
            text-align: center;
            font-size: 12px;
        }

        .error-message {
            color: var(--color-error);
        }

        .setup-message {
            color: var(--color-accent);
        }

        .error-message.show,
        .setup-message.show {
            display: block;
        }

        .login-footer {
            display: flex;
            justify-content: center;
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .login-footer span {
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 90vw;
        }
    </style>
</head>

<body>
    <main class="login-main">
        <div class="login-art">
            <pre>
⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
⠀⠀⠀⠀⠀⠀⣄⠀⠀⠀⣦⣤⣾⣿⠿⠛⣋⣥⣤⣀⠀⠀⠀⠀
⠀⠀⠀⠀⡤⡀⢈⢻⣬⣿⠟⢁⣤⣶⣿⣿⡿⠿⠿⠛⠛⢀⣄⠀
⠀⠀⢢⣘⣿⣿⣶⣿⣯⣤⣾⣿⣿⣿⠟⠁⠄⠀⣾⡇⣼⢻⣿⣾
⣰⠞⠛⢉⣩⣿⣿⣿⣿⣿⣿⣿⣿⠋⣼⣧⣤⣴⠟⣠⣿⢰⣿⣿
⣶⡾⠿⠿⠿⢿⣿⣿⣿⣿⣿⣿⣿⣈⣩⣤⡶⠟⢛⣩⣴⣿⣿⡟
⣠⣄⠈⠀⣰⡦⠙⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣟⡛⠛⠛⠁
⣉⠛⠛⠛⣁⡔⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⠥⠀⠀
⣭⣏⣭⣭⣥⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡿⢠
</pre>
        </div>

        <form class="login-form" id="login-form">
            <p class="error-message" id="error-message"></p>
            <p class="setup-message" id="setup-message">no accounts yet, create the admin account</p>

            <div class="form-row">
                <label for="username">user</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                    placeholder="john doe">
            </div>

            <div class="form-row">
                <label for="password">passwd</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                    minlength="6" placeholder="*******">
            </div>

            <div class="login-actions">
                <button type="submit" id="submit-btn">sign in</button>
                <button type="button" id="btn-sso-login">sso</button>
            </div>
        </form>
    </main>

    <footer class="login-footer">
        <span id="user-agent"></span>
    </footer>

    <script>
        // Start SSO Login
        document.getElementById('btn-sso-login').addEventListener('click', () => {
            window.location.href = '/api/auth/oidc/login';
        });

        // Check for URL Error params
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = error;
            errorMessage.classList.add('show');
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Check if setup is required
        let isSetupMode = false;

        async function checkSetupRequired() {
            try {
                const response = await fetch('/api/auth/setup-required');
                const data = await response.json();

                if (data.setupRequired) {
                    isSetupMode = true;
                    document.getElementById('submit-btn').textContent = 'create account';
                    document.getElementById('setup-message').classList.add('show');
                    document.getElementById('password').placeholder = 'min 6 chars';
                    // Hide SSO in setup mode
                    document.getElementById('btn-sso-login').style.display = 'none';
                }
            } catch (err) {
                console.error('Error checking setup status:', err);
            }
        }

        // Handle form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');
            const errorMessage = document.getElementById('error-message');

            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'please wait...';

            try {
                const endpoint = isSetupMode ? '/api/auth/setup' : '/api/auth/login';
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }

                // Store token
                localStorage.removeItem('authToken');

                // Redirect to main app (replace history to prevent back button issues)
                window.location.replace('/');

            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = isSetupMode ? 'create account' : 'sign in';
            }
        });

        document.getElementById('user-agent').textContent = navigator.userAgent;

        // Check setup status on load
        checkSetupRequired();
    </script>
</body>

</html>
